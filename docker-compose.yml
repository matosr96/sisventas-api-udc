services:
  app:
    build: .
    ports:
      - "8080:8080"
    environment:
      DB_URL: jdbc:mysql://db:3306/${MYSQL_DATABASE:-bdsisventas}
      DB_USERNAME: ${MYSQL_USER:-sisventas}
      DB_PASSWORD: ${MYSQL_PASSWORD:-sisventas}
      # Sin valor por defecto: exporta JWT_SECRET (>=48 bytes) antes de 'docker compose up'.
      # Si falta, el servicio app no arranca (JwtGenerator lo valida); 'up -d db' sí funciona.
      JWT_SECRET: ${JWT_SECRET-}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000,http://localhost:5173}
    depends_on:
      - db
    networks:
      - sisventas-network

  db:
    image: mysql:8.0
    ports:
      - "3306:3306"
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-bdsisventas}
      MYSQL_USER: ${MYSQL_USER:-sisventas}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-sisventas}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
    volumes:
      - mysql-data:/var/lib/mysql
    networks:
      - sisventas-network

  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    ports:
      - "8081:80"
    environment:
      PMA_HOST: db
    depends_on:
      - db
    networks:
      - sisventas-network

volumes:
  mysql-data:

networks:
  sisventas-network:
    driver: bridge
