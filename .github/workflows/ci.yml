name: Java CI/CD

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    env:
      SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}

    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: maven

    # package ya corre Checkstyle (fase validate) y las pruebas.
    - name: Build and test
      run: ./mvnw -B package

    - name: Upload test results
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: test-results
        path: target/surefire-reports/

    - name: Build Docker image
      run: docker build -t sisventas-api .

    # Solo corre si el repositorio tiene configurado el secret SNYK_TOKEN.
    # Sin el secret se salta en vez de fallar, para no dejar el CI en rojo.
    - name: Security scan (Snyk)
      if: ${{ env.SNYK_TOKEN != '' }}
      uses: snyk/actions/maven@master
      with:
        args: --severity-threshold=high

  # Publica la imagen en GitHub Container Registry cuando el build de main (o de un tag v*)
  # queda en verde. Nadie la despliega: queda lista para `docker run`.
  publish:
    needs: build
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write

    steps:
    - uses: actions/checkout@v4

    - name: Log in to GHCR
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    # latest solo desde main; sha-<commit> siempre; la version cuando el push es un tag vX.Y.Z.
    - name: Image tags
      id: meta
      uses: docker/metadata-action@v5
      with:
        images: ghcr.io/${{ github.repository_owner }}/sisventas-api
        tags: |
          type=raw,value=latest,enable={{is_default_branch}}
          type=sha,prefix=sha-
          type=semver,pattern={{version}}

    - name: Build and push
      uses: docker/build-push-action@v6
      with:
        context: .
        push: true
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
