# Contexto de pruebas: H2 en memoria construido desde las entidades.
# En local y en produccion manda migrations/ con ddl-auto=validate.
spring.datasource.url=jdbc:h2:mem:sisventas;MODE=MySQL;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

app.jwt.secret=secreto_solo_para_pruebas_con_32_caracteres_minimo
app.jwt.expiration=86400000
app.cors.allowed-origins=http://localhost:3000
app.cors.allowed-methods=GET,POST,PUT,DELETE,OPTIONS
app.cors.allowed-headers=Authorization,Content-Type
app.openapi.dev-url=http://localhost:8080
app.openapi.prod-url=http://localhost:8080
app.invoice.business-name=SisVentas (pruebas)
