# Base de datos
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/bdsisventas}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# El esquema lo gobiernan las migraciones de migrations/: ningun arranque migra solo.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

server.port=${PORT:8080}

# JWT. Sin valor por defecto a proposito: la app NO debe arrancar sin un secreto propio.
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration=${JWT_EXPIRATION:86400000}

# CORS
app.cors.allowed-origins=${CORS_ORIGINS:http://localhost:3000,http://localhost:5173}
app.cors.allowed-methods=GET,POST,PUT,DELETE,OPTIONS
app.cors.allowed-headers=Authorization,Content-Type,X-Requested-With

# Facturas y cobro
app.invoice.business-name=${INVOICE_BUSINESS_NAME:SisVentas}
app.invoice.currency=${INVOICE_CURRENCY:COP}
# Tasa de impuesto (porcentaje) que se congela en cada venta. 0 = sin impuesto.
app.sales.tax-rate=${SALES_TAX_RATE:0}
# Zona horaria del negocio: corta los dias de los reportes y del cierre de caja.
app.business.time-zone=${BUSINESS_TIME_ZONE:America/Bogota}

# Actuator
management.endpoints.web.exposure.include=health

# OpenAPI
app.openapi.dev-url=http://localhost:8080
# No hay despliegue: se configura por entorno el dia que lo haya.
app.openapi.prod-url=${OPENAPI_PROD_URL:http://localhost:8080}
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tagsSorter=alpha
