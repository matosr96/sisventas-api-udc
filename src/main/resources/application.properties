# Base de datos
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/bdsisventas}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# El esquema lo gobiernan las migraciones de migraciones/: ningun arranque migra solo.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

server.port=${PORT:8080}

# JWT
app.jwt.secret=${JWT_SECRET:cambia_este_secreto_por_uno_de_al_menos_32_caracteres}
app.jwt.expiration=${JWT_EXPIRATION:86400000}

# CORS
app.cors.allowed-origins=${CORS_ORIGINS:http://localhost:3000,http://localhost:5173}
app.cors.allowed-methods=GET,POST,PUT,DELETE,OPTIONS
app.cors.allowed-headers=Authorization,Content-Type,X-Requested-With

# Actuator
management.endpoints.web.exposure.include=health

# OpenAPI
app.openapi.dev-url=http://localhost:8080
app.openapi.prod-url=https://api.sisventas.unicartagena.edu.co
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tagsSorter=alpha
